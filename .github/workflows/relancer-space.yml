name: Relancer le Space Hugging Face

# Relance le Space (même lien), désactive sa mise en veille, puis vérifie
# /ready. Ne modifie pas le code déployé : aucune synchronisation.
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/relancer-space.yml
  workflow_dispatch:

jobs:
  relancer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: pip install -q "huggingface_hub>=0.24"
      - name: État, relance et attente
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, time, json, urllib.request
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "metan40/insurance_claims_assistance"
          r = api.get_space_runtime(repo)
          print("AVANT :", r.stage, "| matériel :", r.hardware, "| demandé :", r.requested_hardware, "| veille :", r.sleep_time)
          print("Détail :", json.dumps(r.raw, ensure_ascii=False)[:1500])
          try:
              api.set_space_sleep_time(repo, sleep_time=-1)
              print("Mise en veille désactivée.")
          except Exception as e:
              print("Veille non modifiée :", type(e).__name__, e)
          api.restart_space(repo)
          print("Relance demandée.")
          for i in range(80):
              time.sleep(30)
              r = api.get_space_runtime(repo)
              print(f"{(i+1)*30:>5} s : {r.stage}")
              if r.stage == "RUNNING":
                  break
              if r.stage in ("RUNTIME_ERROR", "BUILD_ERROR", "PAUSED", "NO_APP_FILE", "CONFIG_ERROR"):
                  print("Arrêt :", json.dumps(r.raw, ensure_ascii=False)[:1500]); break
          url = "https://metan40-insurance-claims-assistance.hf.space/ready"
          for i in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      print("READY :", resp.read().decode()[:800]); break
              except Exception as e:
                  print("ready pas encore :", e); time.sleep(30)
          PY
