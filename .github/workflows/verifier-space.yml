name: Vérification du Space en ligne

# Interroge l'application publiée (sans la redémarrer) : attend que /ready
# réponde « ready » avec la version attendue, puis pose les questions de
# démonstration par l'API.
on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/verifier-space.yml
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      URL: https://metan40-insurance-claims-assistance.hf.space
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Attendre la version publiée
        run: |
          attendue=$(cat VERSION)
          for i in $(seq 1 90); do
            r=$(curl -s -m 30 "$URL/ready" || true)
            echo "$(date +%H:%M:%S) $r" | cut -c1-300
            if echo "$r" | grep -q "\"$attendue\"" && echo "$r" | grep -q '"status":"ready"'; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Questions de démonstration
        run: python evaluation/verifier_application.py --url "$URL" --repetitions 1
